stages:
  preprocess:
    cmd: uv run src/preprocessing.py
    deps:
    - data/raw/train.csv
    - src/preprocessing.py
    outs:
    - data/interim/train.csv
    - data/interim/val.csv
    - data/processed/train.csv
    - data/processed/val.csv
    - models/random_forest1/columns_transformer.pkl
    params:
    - dataset
    - hyperparameters
    - names
    - paths
    - pipeline_config
    - tuning
  train:
    cmd: uv run src/training.py
    deps:
    - data/processed/train.csv
    - models/random_forest1/columns_transformer.pkl
    - src/training.py
    params:
    - dataset
    - flags
    - hyperparameters
    - names
    - paths
    - pipeline_config
    - tuning
    outs:
    - models/random_forest1/random_forest1.pkl
  evaluate:
    cmd: uv run src/evaluate.py
    deps:
    - data/processed/val.csv
    - models/random_forest1/random_forest1.pkl
    - src/evaluate.py
    params:
    - dataset
    - hyperparameters
    - names
    - paths
    - pipeline_config
    - tuning
    outs:
    - reports/random_forest1/evaluation_report.json
