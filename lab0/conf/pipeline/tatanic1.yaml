working_dir: ${hydra:runtime.cwd}

paths:
  data_parent_dir: ${pipeline.working_dir}/data
  models_parent_dir: ${pipeline.working_dir}/models
  reports_parent_dir: ${pipeline.working_dir}/reports
  figures_parent_dir: ${pipeline.working_dir}/figures
  data:
    raw_data: ${pipeline.paths.data_parent_dir}/raw
    interim_data: ${pipeline.paths.data_parent_dir}/interim
    processed_data: ${pipeline.paths.data_parent_dir}/processed
    external_data: ${pipeline.paths.data_parent_dir}/external

dataset:
  target_col: "Survived"
  id_col: "PassengerId"
  test_size: 0.2

names:
  train_data: "train.csv"
  test_data: "test.csv"
  val_data: "val.csv"
  model_name: "random_forest"
  submission_name: "submission.csv"

pipeline_config:
  drop:
    - PassengerId
    - Name
    - Ticket
    - Cabin
  imputation:
    mean:
      - Age
  scaling:
    standard:
      - Age
      - Fare
    minmax:
      - FamilySize
      - TicketGroupSize
  encoding:
    onehot:
      - Sex
    ordinal:
      - Embarked
      - Deck
      - Title